<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Clímax Refrigeração e Climatização">
  <defs>
    <linearGradient id="lgBlue" x1="0" x2="1">
      <stop offset="0" stop-color="#1f6fe0"/><stop offset="1" stop-color="#2f8bff"/>
    </linearGradient>
    <linearGradient id="lgRed" x1="0" x2="1">
      <stop offset="0" stop-color="#e01e2b"/><stop offset="1" stop-color="#ff3b3b"/>
    </linearGradient>
  </defs>
  <!-- risco azul superior -->
  <path d="M150 28 Q205 10 262 14 Q215 22 172 40 Z" fill="url(#lgBlue)"/>
  <!-- floco de neve -->
  <g transform="translate(118 92)" stroke="#2f8bff" stroke-width="9" stroke-linecap="round" fill="none">
    <g id="lgArm">
      <line x1="0" y1="0" x2="0" y2="-50"/>
      <polyline points="-13,-38 0,-26 13,-38"/>
      <polyline points="-10,-52 0,-44 10,-52" stroke-width="7"/>
    </g>
    <use href="#lgArm" transform="rotate(60)"/>
    <use href="#lgArm" transform="rotate(120)"/>
    <use href="#lgArm" transform="rotate(180)"/>
    <use href="#lgArm" transform="rotate(240)"/>
    <use href="#lgArm" transform="rotate(300)"/>
  </g>
  <!-- sol -->
  <g transform="translate(272 96)" fill="url(#lgRed)">
    <circle r="36"/>
    <g id="lgRay"><path d="M-7 -44 L0 -66 L7 -44 Z"/></g>
    <use href="#lgRay" transform="rotate(30)"/><use href="#lgRay" transform="rotate(60)"/>
    <use href="#lgRay" transform="rotate(90)"/><use href="#lgRay" transform="rotate(-30)"/>
    <use href="#lgRay" transform="rotate(-60)"/><use href="#lgRay" transform="rotate(-90)"/>
    <use href="#lgRay" transform="rotate(120)"/><use href="#lgRay" transform="rotate(-120)"/>
  </g>
  <!-- ondas -->
  <path d="M52 168 Q120 118 205 132 Q290 146 350 120 Q330 150 270 160 Q190 172 120 152 Q80 142 52 168 Z" fill="url(#lgBlue)"/>
  <path d="M95 178 Q160 140 235 156 Q300 170 345 146 Q320 186 245 186 Q175 186 95 178 Z" fill="url(#lgRed)"/>
  <!-- marca -->
  <text x="200" y="262" text-anchor="middle" font-family="'Poppins','Montserrat','Arial Black',sans-serif" font-weight="900" font-style="italic" font-size="92" letter-spacing="-3" fill="#fff">CLÍMA<tspan fill="#2f8bff">X</tspan></text>
</svg>
